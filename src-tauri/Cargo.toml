[package]
name = "terminal-composer"
version = "1.2.0"
description = "Linux terminal with a ChatGPT-like input composer"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (see rust-lang/cargo#8519).
name = "terminal_composer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
wl-clipboard-rs = "0.9"
x11-clipboard = "0.9"
tauri-plugin-clipboard-manager = "2.3.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
